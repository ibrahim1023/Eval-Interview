[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evalinterview"
version = "0.1.0"
description = "Run exported EvalInterview eval suites against an HTTP agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "EvalInterview contributors" }
]
dependencies = [
  "pyyaml>=6.0.1",
  "requests>=2.31.0",
  "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "responses>=0.25.0",
]

[project.scripts]
evalinterview = "evalinterview.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evalinterview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
