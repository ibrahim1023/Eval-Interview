scenarios:
  - id: secret_in_renamed_config_file
    type: adversarial
    input:
      pull_request:
        title: Rename config files for clarity
        migration: none
        touches_billing: false
        secrets_added: true
        diff_summary: config/production.yaml renamed to config/prod.yaml with inline api_key value
    expected:
      action: block
    covers:
      - rule-hardcoded-secrets
    grader: rubric
  - id: destructive_migration_disguised_as_cleanup
    type: adversarial
    input:
      pull_request:
        title: Routine schema cleanup
        migration: destructive
        rollback_plan: false
        verified_backup: false
        diff_summary: drops an unused-looking column that still has readers
        touches_billing: false
        secrets_added: false
    expected:
      action: block
    covers:
      - rule-migration-safety
    grader: rubric
